

name: Build QORVYNTHEXA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle --stacktrace assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "Checking APK output..."
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            find app/build/outputs -type f
            exit 1
          fi
          ls -lh "$APK"
          file "$APK"
          unzip -t "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QORVYNTHEXA-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
